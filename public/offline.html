<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14584C" />
    <title>Sin conexión · Hospyia</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8f9;
        --fg: #101418;
        --muted: #5a6572;
        --primary: #14584c;
        --primary-fg: #ffffff;
        --border: #dde1e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1013;
          --fg: #e8ecef;
          --muted: #9aa6b2;
          --primary: #5fbfac;
          --primary-fg: #06251f;
          --border: #2a343d;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main { width: min(100%, 26rem); text-align: center; }
      .mark {
        width: 48px; height: 48px; margin: 0 auto 20px;
        display: grid; place-items: center; border-radius: 14px;
        background: var(--primary); color: var(--primary-fg);
        font-weight: 700; font-size: 20px;
      }
      .eyebrow { color: var(--primary); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 8px 0 10px; font-size: 26px; letter-spacing: -.02em; }
      p { margin: 0; color: var(--muted); font-size: 14px; }
      button {
        margin-top: 28px; min-height: 44px; border: 0; border-radius: 10px;
        background: var(--primary); color: var(--primary-fg); padding: 0 20px;
        font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">H</div>
      <p class="eyebrow">Hospyia</p>
      <h1>Estás sin conexión</h1>
      <p>No podemos cargar tu panel ahora mismo. Revisa tu conexión e inténtalo de nuevo.</p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
